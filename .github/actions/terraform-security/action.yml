name: Terraform Security Scan
description: Run TFLint, tfsec, and Trivy configuration scans

inputs:
  working_directory:
    description: Terraform directory to scan
    required: true

runs:
  using: composite
  steps:
    - name: Install TFLint
      uses: terraform-linters/setup-tflint@v6

    - name: Initialize TFLint
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: tflint --init

    - name: Run TFLint
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: tflint --recursive --format compact --force

    - name: Run tfsec
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: ${{ inputs.working_directory }}
        soft_fail: "true"

    - name: Run Trivy configuration scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: config
        scan-ref: ${{ inputs.working_directory }}
        severity: CRITICAL,HIGH,MEDIUM
        exit-code: "0"
        format: table